# ObservaOne Gateway: TLS for the site's agents, everything to the gateway process.
events {}
http {
  server_tokens off;
  client_max_body_size 5m;
  server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /agent/server.crt {             # agents pin this certificate's fingerprint at install
      alias /etc/nginx/certs/server.crt;
      default_type application/x-pem-file;
    }
    location / {
      proxy_pass http://gateway:8080;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
    }
  }
}
