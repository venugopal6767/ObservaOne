# Nginx: the only entry point. HTTPS on 443, HTTP 80 redirects to HTTPS.
#   https://SERVER/                     -> ObservaOne UI (its own login)
#   https://SERVER/grafana/             -> Grafana (Grafana login)
#   https://SERVER/prometheus/          -> Prometheus   (admin login from .env)
#   https://SERVER/alertmanager/        -> Alertmanager (admin login from .env)
#   https://SERVER/loki/api/v1/push     -> Loki log intake    (ingest login from .env)
#   https://SERVER/otlp/v1/logs         -> Loki OTLP logs     (ingest login)
#   https://SERVER/otlp/v1/traces       -> Tempo OTLP traces  (ingest login)
#   https://SERVER/agent/               -> ObservaOne Agent installers and files (public, no secrets)
#   https://SERVER/ingest/agent/...     -> uploads from ObservaOne Agents (agent token, checked by the UI)

worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  # Websocket support (Grafana live updates)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Slow down password guessing
  limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $http_host;   # host:port the browser used (agent install commands)

    # Docker's internal DNS: keeps working if a container restarts with a new IP
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $observa      http://observa:8080;
    set $grafana      http://grafana:3000;
    set $prometheus   http://prometheus:9090;
    set $alertmanager http://alertmanager:9093;
    set $loki         http://loki:3100;
    set $tempo_otlp   http://tempo:4318;

    # ---- ObservaOne UI ----
    location / {
      proxy_pass $observa;
    }
    # ObservaOne Agent control plane + metrics (agents authenticate themselves; see routes/agent-control.js)
    location = /api/agent/v1/metrics {       # agent 1.1
      client_max_body_size 4m;               # gzip payload; the app checks the unpacked size too
      proxy_pass $observa;
    }
    location ~ ^/api/v1/agents/agt_[0-9a-f]{20}/metrics$ {
      client_max_body_size 4m;
      proxy_pass $observa;
    }
    location ~ ^/api/v1/agents/agt_[0-9a-f]{20}/diagnostics$ {
      client_max_body_size 1m;               # diagnostics bundle requested from the Agents page
      proxy_pass $observa;
    }
    # Prometheus service discovery for agents: only Prometheus (inside the stack) calls it, never from outside
    location ^~ /api/v1/sd/ {
      return 404;
    }
    location = /api/login {
      limit_req zone=login burst=10 nodelay;   # max ~10 sign-in tries per minute per IP
      proxy_pass $observa;
    }

    # ---- Grafana under /grafana/ ----
    location = /grafana { return 301 /grafana/; }
    location /grafana/api/live/ {
      rewrite ^/grafana/(.*)$ /$1 break;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
      proxy_pass $grafana;
    }
    location /grafana/ {
      add_header X-Frame-Options "SAMEORIGIN" always;
      rewrite ^/grafana/(.*)$ /$1 break;
      proxy_pass $grafana;
    }

    # ---- Prometheus (admins only) ----
    location = /prometheus { return 301 /prometheus/; }
    location /prometheus/ {
      limit_req zone=admin burst=40 nodelay;
      auth_basic           "Prometheus - admins only";
      auth_basic_user_file /etc/nginx/auth/htpasswd;
      proxy_pass $prometheus;
    }

    # ---- Alertmanager (admins only) ----
    location = /alertmanager { return 301 /alertmanager/; }
    location /alertmanager/ {
      limit_req zone=admin burst=40 nodelay;
      auth_basic           "Alertmanager - admins only";
      auth_basic_user_file /etc/nginx/auth/htpasswd;
      proxy_pass $alertmanager;
    }

    # ---- Log and trace intake (push only, no reading) ----
    location = /loki/api/v1/push {
      auth_basic           "ingest";
      auth_basic_user_file /etc/nginx/auth/ingest.htpasswd;
      proxy_pass $loki;
    }
    location = /otlp/v1/logs {
      auth_basic           "ingest";
      auth_basic_user_file /etc/nginx/auth/ingest.htpasswd;
      proxy_pass $loki;
    }
    location = /otlp/v1/traces {
      auth_basic           "ingest";
      auth_basic_user_file /etc/nginx/auth/ingest.htpasswd;
      rewrite ^/otlp/(.*)$ /$1 break;
      proxy_pass $tempo_otlp;
    }
    location /loki/ { return 404; }   # never expose Loki queries without login

    # ---- ObservaOne Agent ----
    # Installers, configs and (optionally) mirrored binaries for servers without internet
    location /agent/ {
      alias /usr/share/nginx/agent/;
      autoindex off;
      types { text/plain sh ps1 yaml yml env txt; application/gzip gz; application/zip zip; application/x-msi msi; }
      default_type application/octet-stream;
      add_header Cache-Control "no-cache";
    }
    location = /agent/server.crt {
      alias /etc/nginx/certs/server.crt;     # agents check its SHA-256 before trusting it
      default_type application/x-pem-file;
    }

    # Every agent upload is checked by the UI: valid token, agent not blocked
    location = /_agent_auth {
      internal;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_pass $observa/internal/agent-verify;
    }
    location = /ingest/agent/metrics {
      auth_request /_agent_auth;
      client_max_body_size 32m;
      proxy_set_header Authorization "";
      rewrite ^ /prometheus/api/v1/write break;
      proxy_pass $prometheus;
    }
    location = /ingest/agent/v1/logs {
      auth_request /_agent_auth;
      client_max_body_size 32m;
      proxy_set_header Authorization "";
      rewrite ^ /otlp/v1/logs break;
      proxy_pass $loki;
    }
    location = /ingest/agent/v1/traces {
      auth_request /_agent_auth;
      client_max_body_size 32m;
      proxy_set_header Authorization "";
      rewrite ^ /v1/traces break;
      proxy_pass $tempo_otlp;
    }
    location /internal/ { return 404; }
  }
}
