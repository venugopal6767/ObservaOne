# Windows servers to monitor. One entry per server: "name-or-ip:9182".
# Prometheus re-reads this file every minute. No restart needed.
# Labels are free text; they show in dashboards and alert emails.

# LAB: windows_exporter running on the same PC as Docker Desktop
- targets:
    - "host.docker.internal:9182"
  labels:
    env: lab
    role: test

